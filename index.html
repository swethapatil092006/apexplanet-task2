
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#home">ApexAuth</a>

            <ul class="navbar-nav ms-auto flex-row">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#login">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#register">Register</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Home Section -->
    <section id="home" class="hero-section">
        <div class="container text-center">
            <h1>Welcome to ApexAuth</h1>
            <p>Secure, simple and responsive authentication.</p>
            <a href="#login" class="btn custom-btn">Get Started</a>
        </div>
    </section>

    <!-- Login Section -->
    <section id="login" class="auth-section">
        <div class="auth-card">
            <h2>Login</h2>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail">Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="loginPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="Show password"
                            onclick="togglePassword('loginPassword', this)"
                        >
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn custom-btn w-100">
                    <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>
                    Login
                </button>

                <p id="loginMessage" class="form-message"></p>
            </form>
        </div>
    </section>

    <!-- Registration Section -->
    <section id="register" class="auth-section">
        <div class="auth-card">
            <h2>Create Account</h2>

            <form id="registerForm">

                <div class="mb-3">
                    <label for="registerName">Full Name</label>
                    <input
                        type="text"
                        id="registerName"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="registerUsername">Username</label>
                    <input
                        type="text"
                        id="registerUsername"
                        class="form-control"
                        placeholder="Choose a username"
                        required
                    >
                    <small id="usernameMessage"></small>
                </div>

                <div class="mb-3">
                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >
                    <small id="emailMessage"></small>
                </div>

                <div class="mb-3">
                    <label for="registerPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="registerPassword"
                            class="form-control"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="Show password"
                            onclick="togglePassword('registerPassword', this)"
                        >
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="Show password"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn custom-btn w-100">
                    <i class="bi bi-person-plus me-2" aria-hidden="true"></i>
                    Register
                </button>

                <p id="registerMessage" class="form-message"></p>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>
            <i class="bi bi-shield-check me-1" aria-hidden="true"></i>
            © 2026 ApexAuth | Built for Full Stack Development Internship
        </p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
